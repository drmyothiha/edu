map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

upstream aims_backend {
    server 127.0.0.1:18080;
    keepalive 32;
}

upstream edu_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 100M;

    # Landing page for No.1 DSGH Hospital Portal
    location = / {
        root /var/www/landing;
        try_files /index.html =404;
    }

    location = /index.html {
        root /var/www/landing;
        try_files /index.html =404;
    }

    # Redirect /aims to /aims/
    location = /aims {
        return 301 /aims/;
    }

    # AIMS Portal Entrypoint
    location = /aims/ {
        proxy_pass http://aims_backend/login;
        proxy_hide_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /aims;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /aims/ {
        proxy_pass http://aims_backend/;
        proxy_hide_header Set-Cookie;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /aims;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_redirect ~^(/.*)$ /aims$1;
    }

    # ====================================================
    # EduPlatform (/edu) Service Configuration
    # ====================================================

    # Redirect /edu to /edu/
    location = /edu {
        return 301 /edu/;
    }

    # Edu Platform API Reverse Proxy
    location /edu/api/ {
        proxy_pass http://edu_backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /edu;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Edu Platform Frontend (Single Page Application)
    location /edu/ {
        root /var/www;
        index index.html;
        try_files $uri $uri/ /edu/index.html;
    }

    # Explicit Logout Handling
    location /api/v1/auth/logout {
        proxy_pass http://aims_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Set-Cookie "auth_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; SameSite=Lax" always;
        add_header Set-Cookie "ward_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; SameSite=Lax" always;
    }

    location = /logout {
        proxy_pass http://aims_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Set-Cookie "auth_token=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; SameSite=Lax" always;
        add_header Set-Cookie "ward_session=; Path=/; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; SameSite=Lax" always;
    }

    location / {
        proxy_pass http://aims_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
