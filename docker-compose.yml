version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: edu-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-edu_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-edu_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: edu-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: "8080"
      APP_ENV: "production"
      DATABASE_URL: "postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-edu_db}?sslmode=disable"
      AUTO_MIGRATE: "true"
      MIGRATE_ON_START: "true"
      JWT_SECRET: "${JWT_SECRET:-super-secret-edu-platform-jwt-signing-key-32b!}"
      JWT_EXPIRATION_HOURS: "${JWT_EXPIRATION_HOURS:-24}"
      LLM_PROVIDER: "${LLM_PROVIDER:-mock}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
      LLM_MODEL: "${LLM_MODEL:-gpt-4o-mini}"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
